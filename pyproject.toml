[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "connected-gallery"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
 "python-dotenv>=1,<2", "pillow>=11,<13", "numpy>=2,<3",
 "langgraph>=1,<2", "langchain-anthropic>=1,<2",
 "httpx>=0.28,<1", "langgraph-checkpoint-sqlite>=3,<4"
]

[project.optional-dependencies]
vision = ["torch>=2.6", "transformers>=4.51,<5", "opencv-python-headless>=4.10,<5", "sentencepiece", "paddleocr>=3,<4", "paddlepaddle>=3,<4"]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
pythonpath = ["server"]
asyncio_mode = "auto"
testpaths = ["tests"]
